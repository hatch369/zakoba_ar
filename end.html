<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ざこばアクアリウム - おわり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4C9;
    --paper-edge:#D8C79E;
    --ink:#25201A;
    --sea-mid:#0E5C63;
    --sea-deep:#062B34;
    --sea-abyss:#031318;
    --vermillion:#B6432B;
    --gold:#A9834E;
    --foam:#BFE9E4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  /* startと逆向き：海の底から水面へ浮かび上がるグラデーション */
  body{
    font-family:"Noto Sans JP",sans-serif;
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    background:linear-gradient(180deg,
      var(--sea-abyss) 0%,
      var(--sea-deep) 22%,
      var(--sea-mid) 48%,
      #B8A26E 70%,
      var(--paper) 82%,
      var(--paper) 100%);
    background-repeat:no-repeat;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
  }

  /* モード切替 */
  .mode-switch{position:relative;display:inline-flex;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px;margin-bottom:16px;}
  .mode-switch .indicator{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--vermillion);border-radius:999px;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:1;}
  body.mode-kids .mode-switch .indicator{transform:translateX(100%);}
  .mode-switch button{position:relative;z-index:2;border:none;background:transparent;padding:8px 20px;font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.05em;color:#BFE9E4;cursor:pointer;border-radius:999px;transition:color .2s ease;}
  .mode-switch button.active{color:#fff8ee;}

  .kanban-strip{width:100%;max-width:440px;height:10px;background-image:repeating-radial-gradient(circle at 0 100%,transparent 0 6px,var(--gold) 7px 8px,transparent 9px 14px);opacity:.55;margin-bottom:18px;}

  header{text-align:center;margin-bottom:6px;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:1.9rem;letter-spacing:.14em;color:var(--paper);position:relative;display:inline-block;padding-bottom:10px;}
  h1::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:34px;height:3px;background:var(--vermillion);border-radius:2px;}
  .subtitle{margin-top:12px;font-size:.85rem;letter-spacing:.08em;color:var(--foam);}
  body.mode-kids .subtitle{font-size:.95rem;font-weight:500;}
  ruby rt{font-size:.55em;color:#6b5c3f;}
  header ruby rt{color:var(--foam);}
  body.mode-kids ruby rt{color:#3d6b6f;}
  body.mode-kids header ruby rt{color:var(--foam);}

  /* 表示切替（startと同じ仕組み） */
  .kids-text{display:none !important;}
  body.mode-kids .normal-text{display:none !important;}
  body.mode-kids .kids-text{display:block !important;}
  body.mode-kids .kids-text.inline{display:inline !important;}

  /* 水面ポータル：波紋が広がり、魚が静かに遠ざかる */
  .portal-wrap{width:100%;max-width:260px;aspect-ratio:1/1;margin:18px 0 4px;}
  .portal-wrap svg{width:100%;height:100%;display:block;}
  .ripple{fill:none;stroke:var(--foam);stroke-width:1.4;opacity:0;transform-origin:150px 150px;animation:ripple 4.5s ease-out infinite;}
  .ripple.r2{animation-delay:1.5s;}
  .ripple.r3{animation-delay:3s;}
  @keyframes ripple{0%{opacity:.75;transform:scale(.35);}75%{opacity:0;}100%{opacity:0;transform:scale(1.05);}}
  .fish{animation:away 6s ease-in-out infinite;transform-origin:150px 150px;}
  .fish.f2{animation-duration:8s;animation-delay:.8s;}
  @keyframes away{0%{transform:translate(0,0) scale(1);opacity:.9;}70%{opacity:.25;}100%{transform:translate(-10px,28px) scale(.45);opacity:0;}}

  /* 余韻パネル */
  .story-panel{width:100%;max-width:420px;background:rgba(255,252,240,.9);border:1px solid var(--paper-edge);border-radius:4px;padding:22px;margin-top:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center;}
  .story-panel p{font-size:.92rem;line-height:1.9;color:#33291d;}
  body.mode-kids .story-panel p{font-size:1.08rem;line-height:2.15;font-weight:500;}
  .story-panel .highlight{color:var(--vermillion);font-weight:700;}

  /* お礼・お願い */
  .notice{width:100%;max-width:420px;margin-top:18px;background:linear-gradient(180deg,#F4EFDD,#EAE0C4);border:2px solid var(--gold);border-radius:4px;padding:16px 20px;text-align:center;}
  .notice-title{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:1rem;color:var(--vermillion);margin-bottom:6px;letter-spacing:.06em;}
  .notice p{font-size:.86rem;line-height:1.75;color:#3d3423;}
  body.mode-kids .notice p{font-size:1.02rem;line-height:2;font-weight:500;}

  /* CTA：もう一度あそぶ */
  .cta-wrap{margin:26px 0 4px;position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;}
  .cta-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(182,67,43,.5);animation:cta-pulse 3.2s ease-out infinite;}
  .cta-ring.d2{animation-delay:1.1s;}
  @keyframes cta-pulse{0%{transform:scale(.72);opacity:.7;}100%{transform:scale(1.15);opacity:0;}}
  .btn{position:relative;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#CB5A3E,var(--vermillion) 70%);color:#fff8ee;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:1.05rem;line-height:1.5;letter-spacing:.06em;box-shadow:0 10px 24px rgba(0,0,0,.3),inset 0 0 0 4px rgba(255,255,255,.15);transition:transform .15s ease;text-align:center;}
  body.mode-kids .btn{font-size:1.15rem;}
  .btn:active{transform:scale(.96);}

  footer{margin-top:20px;font-size:.72rem;color:#5a4d38;letter-spacing:.05em;}
</style>
</head>
<body>

  <div class="mode-switch" role="group" aria-label="表示モード切替">
    <div class="indicator"></div>
    <button id="btnNormal" class="active" onclick="setMode('normal')">つうじょう</button>
    <button id="btnKids" onclick="setMode('kids')">キッズ</button>
  </div>

  <div class="kanban-strip"></div>

  <header>
    <h1>ざこばアクアリウム</h1>
    <p class="subtitle">
      <span class="normal-text">〜 江戸の海を、あとにして 〜</span>
      <span class="kids-text inline">〜 また あえる<ruby>日<rt>ひ</rt></ruby>まで 〜</span>
    </p>
  </header>

  <div class="portal-wrap">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <radialGradient id="seaGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#12666E"/>
          <stop offset="100%" stop-color="#052D33"/>
        </radialGradient>
      </defs>
      <circle class="ripple r1" cx="150" cy="150" r="60"/>
      <circle class="ripple r2" cx="150" cy="150" r="60"/>
      <circle class="ripple r3" cx="150" cy="150" r="60"/>
      <circle cx="150" cy="150" r="118" fill="none" stroke="#0A4A50" stroke-width="1" opacity=".5"/>
      <circle cx="150" cy="150" r="100" fill="url(#seaGrad)"/>
      <g class="fish" fill="#BFE9E4">
        <path d="M120 150 q14 -12 30 0 q-16 5 -16 0 q0 5 -16 0 q2 -0 2 0z"/>
        <path d="M118 150 l-9 -6 v12 z"/>
      </g>
      <g class="fish f2" fill="#8FD6CE">
        <path d="M175 175 q12 -10 26 0 q-14 4 -14 0 q0 4 -14 0 q1 -0 2 0z"/>
        <path d="M173 175 l-8 -5 v10 z"/>
      </g>
    </svg>
  </div>

  <section class="story-panel">
    <p class="normal-text">
      ご体験ありがとうございました。<br><br>
      江戸の海は、また芝生の下で静かに眠りにつきます。<br><br>
      今日のあなたの思い出も、いつか誰かの<br>
      昔話になるかもしれません。
    </p>
    <p class="kids-text">
      あそんでくれて ありがとう！<br><br>
      <ruby>海<rt>うみ</rt></ruby> は また、<ruby>芝生<rt>しばふ</rt></ruby> の したで ねむります。<br><br>
      きょうの おもいでも、<br>
      いつか だれかの むかしばなしに なるかも。<br>
    </p>
  </section>

  <section class="notice">
    <div class="notice-title">
      <span class="normal-text">お帰りの前に</span>
      <span class="kids-text inline">かえるまえに</span>
    </div>
    <p class="normal-text">
      お忘れ物がないか、<br>
      ご確認ください。
    </p>
    <p class="kids-text">
      わすれものは ないかな？<br>
      ごみは もちかえろうね。
    </p>
  </section>

  <div class="cta-wrap">
    <div class="cta-ring"></div>
    <div class="cta-ring d2"></div>
    <a href="start.html" class="btn">
      <span class="normal-text">もう一度<br>あそぶ</span>
      <span class="kids-text inline">もういちど<br>あそぶ</span>
    </a>
  </div>

  <footer>靱公園 雑喉場アクアリウム</footer>

  <script>
    function setMode(mode){
      document.body.classList.toggle('mode-kids', mode === 'kids');
      document.getElementById('btnNormal').classList.toggle('active', mode !== 'kids');
      document.getElementById('btnKids').classList.toggle('active', mode === 'kids');
      try{ localStorage.setItem('zakoba-mode', mode); }catch(e){}
    }
    (function(){
      var saved = null;
      try{ saved = localStorage.getItem('zakoba-mode'); }catch(e){}
      if(saved === 'kids') setMode('kids');
    })();
  </script>

</body>
</html>
