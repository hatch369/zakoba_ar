<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雑喉場アクアリウム - 終了</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #006064 0%, #e0f7fa 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 {
      font-size: 1.4rem;
      color: #00838f;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #555;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 280px;
      background: #00838f;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 14px 0;
      border-radius: 30px;
      box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>現代の靭公園へ戻ってきました！</h2>
    <p>
      足元の芝生の下には、いまも歴史の記憶が静かに眠っています。
      また、のぞいてみてね🐋
    </p>
    <!-- start.html へ戻る -->
    <a href="start.html" class="btn">もう一度のぞいてみる</a>
  </div>
</body>
</html>
