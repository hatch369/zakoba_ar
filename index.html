<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ざこばアクアリウム - 体験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  :root{
    --paper:#EDE4C9; --ink:#25201A;
    --sea-mid:#0E5C63; --sea-deep:#062B34; --sea-abyss:#031318;
    --vermillion:#B6432B; --gold:#A9834E; --foam:#BFE9E4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sea-abyss);font-family:"Noto Sans JP",sans-serif;touch-action:none;}
  #camvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:var(--sea-abyss);}
  a-scene{position:fixed !important;inset:0;z-index:1;}
  ruby rt{font-size:.55em;}
  body.xr .ui{display:none !important;}

  .ui{position:fixed;z-index:20;font-family:"Noto Sans JP",sans-serif;}
  .pill{border:1px solid rgba(237,228,201,.55);background:rgba(6,43,52,.72);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.05em;cursor:pointer;backdrop-filter:blur(3px);}
  .pill:active{transform:scale(.96);}
  #quit{top:calc(14px + env(safe-area-inset-top,0px));right:14px;}
  #place{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-weight:500;background:rgba(6,43,52,.55);}
  #motion{left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--vermillion);border-color:rgba(255,255,255,.4);color:#fff8ee;}

  #hint{left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;transition:opacity .9s ease,transform .9s ease;pointer-events:none;
    background:rgba(237,228,201,.94);color:var(--ink);border:2px solid var(--gold);border-radius:999px;padding:12px 26px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:1.05rem;letter-spacing:.08em;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  #hint.on{opacity:1;transform:translate(-50%,0);}
  #hint rt{color:#6b5c3f;}
  body.kids #hint{font-size:1.15rem;}

  #gate{inset:0;background:linear-gradient(180deg,var(--sea-mid),var(--sea-deep) 60%,var(--sea-abyss));display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:30;}
  .gate-inner{max-width:360px;}
  .gate-inner h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:1.7rem;letter-spacing:.14em;color:var(--paper);margin:0 0 22px;}
  .gate-inner p{color:var(--foam);font-size:.95rem;line-height:1.9;margin:0 0 24px;}
  body.kids .gate-inner p{font-size:1.08rem;line-height:2.1;}
  .gate-inner rt{color:var(--foam);}
  #gateBtn{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#CB5A3E,var(--vermillion) 70%);color:#fff8ee;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:1.05rem;line-height:1.5;letter-spacing:.06em;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.15);cursor:pointer;padding:12px;}
  #gateBtn:active{transform:scale(.96);}
  #snd{left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-weight:500;font-size:.78rem;background:rgba(6,43,52,.6);pointer-events:none;white-space:nowrap;}
  #dbg{left:8px;right:8px;top:calc(62px + env(safe-area-inset-top,0px));color:#9ff;font:10px/1.35 monospace;background:rgba(0,0,0,.55);padding:3px 6px;pointer-events:none;white-space:pre-wrap;word-break:break-all;}

  @media (prefers-reduced-motion:reduce){ #hint{transition:none;} }
</style>
<script>
/* ---- 傾きセンサーで視点を回す（iOS許可の扱いを自前で制御するため look-controls は使わない） ---- */
AFRAME.registerComponent('gyro-look',{
  init:function(){
    var THREE=AFRAME.THREE, self=this;
    this.hasSensor=false; this.a=0; this.b=0; this.g=0; this.yaw=0; this.pitch=0;
    this.euler=new THREE.Euler(); this.q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
    this.q0=new THREE.Quaternion(); this.zee=new THREE.Vector3(0,0,1);
    this.el.object3D.position.set(0,1.1,0);
    window.addEventListener('deviceorientation',function(e){
      if(e.alpha===null||e.beta===null||e.alpha===undefined) return;
      self.hasSensor=true; self.a=e.alpha; self.b=e.beta; self.g=e.gamma;
    },true);
    // センサーがない端末（PCでの確認用）：ドラッグで見回す
    var down=false,lx=0,ly=0;
    window.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;ly=e.clientY;});
    window.addEventListener('pointermove',function(e){
      if(!down||self.hasSensor) return;
      self.yaw-=(e.clientX-lx)*0.005;
      self.pitch=Math.max(-1.5,Math.min(1.5,self.pitch-(e.clientY-ly)*0.005));
      lx=e.clientX;ly=e.clientY;
    });
    window.addEventListener('pointerup',function(){down=false;});
  },
  tick:function(){
    var sc=this.el.sceneEl;
    if(sc.is('vr-mode')||sc.is('ar-mode')) return;   // XR中は端末の姿勢追跡に任せる
    var q=this.el.object3D.quaternion, D=Math.PI/180;
    if(this.hasSensor){
      var orient=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D;
      this.euler.set(this.b*D,this.a*D,-this.g*D,'YXZ');
      q.setFromEuler(this.euler); q.multiply(this.q1); q.multiply(this.q0.setFromAxisAngle(this.zee,-orient));
    }else{
      this.euler.set(this.pitch,this.yaw,0,'YXZ'); q.setFromEuler(this.euler);
    }
  }
});
AFRAME.registerComponent('zk-loop',{ tick:function(t,dt){ if(window.__zkFrame) window.__zkFrame(t,dt); } });
</script>
</head>
<body>

<video id="camvideo" playsinline muted autoplay></video>

<a-scene id="scene"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="alpha: true; antialias: true"
  webxr="optionalFeatures: local-floor, bounded-floor; referenceSpaceType: local-floor">
  <a-entity id="cam3d" camera="fov: 70; near: 0.05; far: 60" gyro-look></a-entity>
  <a-entity light="type: ambient; color: #ffffff; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 1.2" position="1 3 1.5"></a-entity>
  <a-entity id="ctlL" laser-controls="hand: left" raycaster="objects: .none"></a-entity>
  <a-entity id="ctlR" laser-controls="hand: right" raycaster="objects: .none"></a-entity>
  <a-entity zk-loop></a-entity>
</a-scene>

<button id="quit" class="ui pill" type="button"></button>
<button id="place" class="ui pill" type="button"></button>
<div id="hint" class="ui"></div>
<button id="motion" class="ui pill" type="button" hidden></button>
<div id="snd" class="ui pill" hidden></div>

  <div class="gate-inner">
    <h1>ざこばアクアリウム</h1>

    <button id="gateBtn" type="button" hidden></button>
  </div>
</div>

<script>
(function(){
'use strict';
var THREE = AFRAME.THREE;

/* ============ 調整用パラメータ ============ */
var CFG = {
  DIST: 1.6,          // 目線から水面までの距離(m)
  EYE_H: 1.1,         // 座った目線の高さ(m)
  FOV: 70,
  WATER_R: 1.3,       // 水面の半径(m)
  T_WATER: 4.0,       // 市場の場面を見せる秒数（この後に水面が出る）
  T_HINT: 3.0,        // 魚影が泳ぎ始めてからヒントまで
  T_GLOW: 10.0,       // 魚影が泳ぎ始めてから、波紋を光らせるまで
  STAGGER: 0.3,       // 飛び出しの間隔(秒)
  KEEP: 1.05,         // 顔の周り、魚が入らない半径(m)
  SEA_OP_PHONE: 0.88, // 海の球の濃さ（スマホ）
  SEA_OP_AR: 0.5,     // 海の球の濃さ（Quest パススルー）
  GLB_TIMEOUT: 10,    // GLBの読み込みを待つ最大秒数（市場の開始から。超えたら図形の魚で続行）
  SARDINES: 240,      // イワシの数（?n_sardine=… で変更。重ければ減らす）
  SARDINE_SIZE: 1.6   // イワシの大きさの倍率（1.0で約13cm。?sz_sardine=… で変更）
};

/* ============ 文言（つうじょう／キッズ） ============ */
var kids = false;
try{ kids = localStorage.getItem('zakoba-mode') === 'kids'; }catch(e){}
document.body.classList.toggle('kids', kids);
function P(n,k){ return kids ? k : n; }
var TXT = {
  quit:  P([{t:'体験をおわる'}],[{t:'体験',r:'たいけん'},{t:'を おわる'}]),
  place: P([{t:'位置をなおす'}],[{t:'位置',r:'いち'},{t:'を なおす'}]),
  hint:  P([{t:'水面にふれてみよう'}],[{t:'水面',r:'すいめん'},{t:'に ふれてみよう'}]),
  start: P([{t:'タップして'},{t:'はじめる'}],[{t:'タップして'},{t:' はじめよう'}]),
  camLoading: P([{t:'カメラをひらいています…'}],[{t:'カメラを ひらいているよ…'}]),
  camDeny: P([{t:'カメラが使えませんでした。許可を確認して、もう一度タップしてください。'}],
             [{t:'カメラが つかえなかったよ。'},{t:'許可',r:'きょか'},{t:'を えらんで、もういちど タップしてね。'}]),
  quest: P([{t:'ARをはじめます。ボタンを押してください。'}],[{t:'ARを はじめるよ。ボタンを おしてね。'}]),
  noXR:  P([{t:'このブラウザでは、ARをはじめられませんでした。もう一度お試しください。'}],
           [{t:'ARを はじめられなかったよ。もういちど ためしてね。'}]),
  motion:P([{t:'傾きセンサーを許可'}],[{t:'スマホの '},{t:'傾',r:'かたむ'},{t:'きを つかう'}]),
  snd:   P([{t:'ふれると音がでるよ'}],[{t:'ふれると '},{t:'音',r:'おと'},{t:'が でるよ'}])
};
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function H(segs){ return segs.map(function(s){ return s.r ? '<ruby>'+esc(s.t)+'<rt>'+esc(s.r)+'</rt></ruby>' : esc(s.t); }).join(''); }
function plain(segs){ return segs.map(function(s){return s.t+(s.r||'');}).join(''); }

/* ============ DOM ============ */
var $ = function(id){ return document.getElementById(id); };
var scene = $('scene'), camEl = $('cam3d'), vid = $('camvideo');
var elQuit=$('quit'), elPlace=$('place'), elHint=$('hint'), elMotion=$('motion'), elSnd=$('snd'), elGate=$('gate'), elGateMsg=$('gateMsg'), elGateBtn=$('gateBtn'), elDbg=$('dbg');
elQuit.innerHTML = H(TXT.quit); elPlace.innerHTML = H(TXT.place); elHint.innerHTML = H(TXT.hint); elMotion.innerHTML = H(TXT.motion); elSnd.innerHTML = H(TXT.snd);
if(/[?&]debug/.test(location.search)) elDbg.hidden = false;

var isQuest = /OculusBrowser|Quest/i.test(navigator.userAgent);
var needMotionPerm = (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function');
function requestMotion(){
  if(!needMotionPerm) return Promise.resolve('granted');
  try{ return DeviceOrientationEvent.requestPermission().catch(function(){ return 'denied'; }); }catch(e){ return Promise.resolve('denied'); }
}
var gateHandler = null;
function showGate(msgSegs, btnSegs, onClick){
  elGate.hidden = false;
  elGateMsg.innerHTML = H(msgSegs);
  if(btnSegs){ elGateBtn.hidden = false; elGateBtn.innerHTML = H(btnSegs); } else { elGateBtn.hidden = true; }
  gateHandler = onClick || null;
}
function hideGate(){ elGate.hidden = true; }
elGateBtn.addEventListener('click', function(){ if(gateHandler) gateHandler(); });

/* ============ 小物 ============ */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function ease(u){ u=clamp(u,0,1); return u*u*(3-2*u); }
function easeOut(u){ return 1-Math.pow(1-clamp(u,0,1),3); }
function lerp(a,b,k){ return a+(b-a)*k; }
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function mkTex(c){ var t=new THREE.CanvasTexture(c); if(THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
var SANS='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
var MINCHO='"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif';

/* ふりがな付きの文字ラベル（Quest用の3Dボタン・ヒント） */
function labelTexture(segs,o){
  o = Object.assign({font:56,padX:40,padY:24,bg:'rgba(237,228,201,0.96)',fg:'#25201A',border:'#A9834E'},o||{});
  var c=document.createElement('canvas'), ctx=c.getContext('2d');
  var hasR=segs.some(function(s){return s.r;}), rf=Math.round(o.font*0.42), top=hasR?rf+8:0;
  ctx.font='700 '+o.font+'px '+SANS;
  var ws=segs.map(function(s){return ctx.measureText(s.t).width;});
  var tw=ws.reduce(function(a,b){return a+b;},0);
  c.width=Math.ceil(tw+o.padX*2); c.height=Math.ceil(o.font*1.25+o.padY*2+top);
  rr(ctx,3,3,c.width-6,c.height-6,26); ctx.fillStyle=o.bg; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=o.border; ctx.stroke();
  var x=o.padX, by=o.padY+top+o.font;
  segs.forEach(function(s,i){
    ctx.font='700 '+o.font+'px '+SANS; ctx.fillStyle=o.fg; ctx.textAlign='left'; ctx.fillText(s.t,x,by-o.font*0.18);
    if(s.r){ ctx.font='700 '+rf+'px '+SANS; ctx.textAlign='center'; ctx.fillText(s.r,x+ws[i]/2,o.padY+rf); }
    x+=ws[i];
  });
  return {tex:mkTex(c), aspect:c.width/c.height};
}

/* ============ 状態 ============ */
var S = { built:false, ready:false, pending:false, state:'boot', eyeH:CFG.EYE_H, xr:false,
  tStart:0, tWater:0, waterK:0, hintShown:false, glow:false,
  marketFade:0, marketTarget:1, seaK:0, seaT0:-1, discFade:1, seaMax:CFG.SEA_OP_PHONE };
var T = 0;
var world, uiRig, waterRig, marketGroup, seaMesh, raysGroup, bubbles, waveRing, disc, glowDisc, hintMesh;
var xrButtons = [], ripples = [], sways = [], fish = [], marketMats = [];
var stream = null;

var vCam=new THREE.Vector3(), qCam=new THREE.Quaternion(), vFwd=new THREE.Vector3(), vUp=new THREE.Vector3();
var headL=new THREE.Vector3(), tmpV=new THREE.Vector3(), tmpV2=new THREE.Vector3(), tmpDir=new THREE.Vector3();
var m4=new THREE.Matrix4(), qT=new THREE.Quaternion(), ZERO=new THREE.Vector3(), UPV=new THREE.Vector3(0,1,0);
var RC=new THREE.Raycaster();

/* ============ 位置合わせ ============ */
function place(full){
  camEl.object3D.getWorldPosition(vCam);
  camEl.object3D.getWorldQuaternion(qCam);
  vFwd.set(0,0,-1).applyQuaternion(qCam); vUp.set(0,1,0).applyQuaternion(qCam);
  var hx=vFwd.x, hz=vFwd.z;
  if(Math.hypot(hx,hz)<0.4){ var sg=vFwd.y<0?1:-1; hx=vUp.x*sg; hz=vUp.z*sg; } // 真下を見ているときは、端末の「上」が前
  var yaw=Math.atan2(-hx,-hz), n=Math.hypot(hx,hz)||1; hx/=n; hz/=n;
  if(full){
    S.eyeH = clamp(vCam.y,0.6,1.7);
    world.position.set(vCam.x,0,vCam.z);
    seaMesh.position.y = S.eyeH; raysGroup.position.y = S.eyeH;
  }
  var d=Math.sqrt(Math.max(CFG.DIST*CFG.DIST-S.eyeH*S.eyeH,0.36));
  waterRig.position.set(hx*d,0,hz*d); waterRig.rotation.y=yaw;
  uiRig.position.set(world.position.x,0,world.position.z); uiRig.rotation.y=yaw;
  xrButtons.forEach(function(b){ b.mesh.position.set(b.x,S.eyeH-0.5,b.z); });
}

/* ============ 市場（コードで描く：のぼり・暖簾・屋台・提灯） ============ */
function regM(m){ m.transparent=true; marketMats.push({m:m,base:m.opacity}); return m; }
function polar(deg,r){ var a=deg*Math.PI/180; return new THREE.Vector3(Math.sin(a)*r,0,-Math.cos(a)*r); }
var G = {
  sph:new THREE.SphereGeometry(1,14,10), cone:new THREE.ConeGeometry(1,1,6),
  box:new THREE.BoxGeometry(1,1,1), cyl:new THREE.CylinderGeometry(1,1,1,8)
};
G.coneZ = new THREE.ConeGeometry(1,1,6); G.coneZ.rotateX(Math.PI/2);   // 先端が +Z
function addMesh(parent,geo,mat,pos,scl){
  var m=new THREE.Mesh(geo,mat); if(pos) m.position.set(pos[0],pos[1],pos[2]); if(scl) m.scale.set(scl[0],scl[1],scl[2]); parent.add(m); return m;
}
function clothTex(ch,bg,fg){
  var c=mkCanvas(256,360), x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,256,360);
  x.strokeStyle='#A9834E'; x.lineWidth=6; x.strokeRect(10,10,236,340);
  x.fillStyle=fg; x.font='800 190px '+MINCHO; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ch,128,190);
  return mkTex(c);
}
function noboriTex(text,bg,fg){
  var c=mkCanvas(128,512), x=c.getContext('2d'), n=text.length;
  x.fillStyle=bg; x.fillRect(0,0,128,512);
  x.strokeStyle='#A9834E'; x.lineWidth=5; x.strokeRect(6,6,116,500);
  var fs=Math.min(96,(512-70)/n);
  x.fillStyle=fg; x.font='800 '+fs+'px '+MINCHO; x.textAlign='center'; x.textBaseline='middle';
  for(var i=0;i<n;i++) x.fillText(text.charAt(i),64,40+(512-80)*(i+0.5)/n);
  return mkTex(c);
}
function buildMarket(){
  var g = marketGroup = new THREE.Group(); world.add(g);
  var wood=regM(new THREE.MeshLambertMaterial({color:0x7A5A3C}));
  var woodD=regM(new THREE.MeshLambertMaterial({color:0x4A3524}));
  var silver=regM(new THREE.MeshLambertMaterial({color:0xC9D3D6}));
  var goldM=regM(new THREE.MeshLambertMaterial({color:0xA9834E}));
  var lantM=regM(new THREE.MeshBasicMaterial({color:0xC9482B}));
  var chars=['雑','喉','場'];
  var norenMats=chars.map(function(ch,i){ return regM(new THREE.MeshBasicMaterial({map:clothTex(ch,i===1?'#B6432B':'#1B3A5C','#EDE4C9'),side:THREE.DoubleSide})); });
  var norenGeo=new THREE.PlaneGeometry(0.5,0.72);

  // 屋台（中心を向く）
  [-62,62,-125,125,180].forEach(function(a){
    var st=new THREE.Group(); st.position.copy(polar(a,3.3)); g.add(st); st.lookAt(0,0,0);
    addMesh(st,G.box,wood,[0,0.375,0],[1.7,0.75,0.6]);
    for(var i=0;i<5;i++){ var f=addMesh(st,G.sph,silver,[-0.6+i*0.3,0.8,0.05],[0.14,0.035,0.05]); f.rotation.y=(i%2?0.3:-0.2); }
    [-1,1].forEach(function(s){ addMesh(st,G.cyl,woodD,[s*0.9,1.05,0.2],[0.04,2.1,0.04]); });
    addMesh(st,G.box,woodD,[0,2.07,0.2],[1.95,0.07,0.07]);
    for(var j=0;j<3;j++){
      var pv=new THREE.Group(); pv.position.set(-0.55+j*0.55,2.04,0.24); st.add(pv);
      addMesh(pv,norenGeo,norenMats[j],[0,-0.36,0]);
      sways.push({o:pv,ax:'x',ph:Math.random()*6,f:1.3+Math.random()*0.6,amp:0.1});
    }
  });
  // のぼり
  var nTexts=['雑喉場','大漁','鮮魚','活魚'], nBg=['#B6432B','#1B3A5C','#1B3A5C','#B6432B'];
  var nMats=nTexts.map(function(t,i){ return regM(new THREE.MeshBasicMaterial({map:noboriTex(t,nBg[i],'#EDE4C9'),side:THREE.DoubleSide})); });
  var nGeo=new THREE.PlaneGeometry(0.5,1.9);
  [-20,20,-45,45,-95,95,-155,155].forEach(function(a,i){
    var gp=new THREE.Group(); gp.position.copy(polar(a,4.1)); g.add(gp); gp.lookAt(0,0,0);
    addMesh(gp,G.cyl,woodD,[0,1.3,0],[0.025,2.6,0.025]);

var SIL=new THREE.Color(0x0A1B45);   // 藍のシルエット
function part(parent,geo,color,pos,scl){
  var mat=new THREE.MeshLambertMaterial({color:color,emissive:0x000000});
  var m=new THREE.Mesh(geo,mat); m.position.set(pos[0],pos[1],pos[2]); m.scale.set(scl[0],scl[1],scl[2]);
  m.userData.base=new THREE.Color(color); parent.add(m); return m;
}
function tintFish(o,k){
  if(o.userData.tk===k) return; o.userData.tk=k;   // 変化がなければ何もしない
  o.traverse(function(m){
    if(!m.isMesh) return;
    if(m.userData.base){ m.material.color.copy(SIL).lerp(m.userData.base,k); m.material.emissive.copy(m.userData.base).multiplyScalar(0.18*k); }
    else if(m.userData.tints){ m.userData.tints.forEach(function(t){ t.mat.color.copy(SIL).lerp(t.base,k); if(t.mat.emissive) t.mat.emissiveIntensity=k; }); }   // GLB
  });
}

function buildFish(){
  FISH_DEF.forEach(function(d,i){
    var o=d.make(); tintFish(o,0); o.scale.setScalar(0.0001); waterRig.add(o);
    fish.push({d:d,obj:o,state:'idle',ph:i*1.3,launchAt:0,t0:0,dur:d.dur,ip:d.ip,orb:{r:d.orb.r,h:d.orb.h,dir:d.orb.dir,alpha:d.orb.alpha,w:d.orb.speed/d.orb.r},
      theta0:0,S:new THREE.Vector3(),C:new THREE.Vector3(),Tp:new THREE.Vector3(),prev:new THREE.Vector3(),last:new THREE.Vector3()});
  });
}
function orbitPos(f,t,out){
  var o=f.orb, th=f.theta0+o.dir*o.w*t;
  return out.set(Math.cos(th)*o.r, S.eyeH+o.h+Math.sin(t*0.7+f.ph)*0.1, Math.sin(th)*o.r);
}
function faceDir(obj,dir,dt,rate){
  if(dir.lengthSq()<1e-9) return;
  m4.lookAt(dir,ZERO,UPV); qT.setFromRotationMatrix(m4);
  obj.quaternion.slerp(qT,1-Math.exp(-dt*rate));
}
function keepOut(p){
  tmpV2.copy(p).sub(headL); var d=tmpV2.length();
  if(d<CFG.KEEP&&d>1e-4){ tmpV2.multiplyScalar(CFG.KEEP/d); p.copy(headL).add(tmpV2); }
}
function launch(f){
  f.state='fly'; f.t0=T; var o=f.obj;
  spawnRipple(f.last.x,f.last.z,0.55,0.9,1.6,0,true);   // しぶき
  Snd.splash(f.d.kind==='whale'?0.7:0.4);
  world.attach(o);
  f.S.copy(o.position); f.S.y=-0.25;
  var tA=T+f.dur; f.theta0=f.orb.alpha-f.orb.dir*f.orb.w*tA;
  orbitPos(f,tA,f.Tp);
  f.C.set((f.S.x+f.Tp.x)/2, 2*(f.d.apex-(f.S.y+f.Tp.y)/4), (f.S.z+f.Tp.z)/2);
  f.prev.copy(f.S);
  startSea();
}
function updateFish(f,dt){
  var o=f.obj, d=f.d;
  if(f.state==='idle'){
    var a=f.ip, ang=a.w*T+a.ph;
    f.last.set(a.a*Math.cos(ang),0,a.b*Math.sin(ang));
    o.position.set(f.last.x,a.y+Math.sin(T*0.9+a.ph)*0.04,f.last.z);
    tmpDir.set(-a.a*Math.sin(ang)*a.w,0,a.b*Math.cos(ang)*a.w);
    faceDir(o,tmpDir,dt,6);
    o.scale.setScalar(Math.max(0.0001,d.sil*ease(S.waterK)));
  }else{
    f.prev.copy(o.position);
    if(f.state==='fly'){
      var u=(T-f.t0)/f.dur;
      if(u>=1){ f.state='orbit'; }
      else{
        var v=1-u;
        o.position.set(v*v*f.S.x+2*v*u*f.C.x+u*u*f.Tp.x, v*v*f.S.y+2*v*u*f.C.y+u*u*f.Tp.y, v*v*f.S.z+2*v*u*f.C.z+u*u*f.Tp.z);
        o.scale.setScalar(lerp(d.sil,d.len,easeOut(u*1.3)));
        tintFish(o,clamp((T-f.t0)/0.5,0,1));   // 飛び出した瞬間に元の色へ
      }
    }
    if(f.state==='orbit'){
      orbitPos(f,T,o.position); o.scale.setScalar(d.len); tintFish(o,1);
    }
    keepOut(o.position);
    tmpDir.copy(o.position).sub(f.prev); faceDir(o,tmpDir,dt,7);
  }
  var ud=o.userData;
  if(ud.mixer) ud.mixer.update(dt);
  if(ud.pivot&&d.sway){ ud.pivot.position.y=Math.sin(T*1.1+f.ph)*0.025; ud.pivot.rotation.z=Math.sin(T*1.3+f.ph)*0.07; }   // 動きのないGLB（ウミガメ）用
  if(ud.tail&&d.tf) ud.tail.rotation.y=Math.sin(T*d.tf[0]+f.ph)*d.tf[1];
  if(ud.flips) ud.flips.forEach(function(pv){ pv.rotation.z=pv.userData.s*Math.sin(T*2.4)*0.5; });
}

/* ============ イワシの群れ（銀色の小さな魚を InstancedMesh で1回描画） ============ */
var SD_SIL = new THREE.Color(0x3a6f9c), SD_WHITE = new THREE.Color(0xc4ced6);   // 水の中は青いシルエット、飛び出すと銀色
var school = null, sdDummy = new THREE.Object3D(), sdCol = new THREE.Color(), sdA = new THREE.Vector3(), sdB = new THREE.Vector3();
function buildSchool(){
  var N = Math.round(qnum('n_sardine', CFG.SARDINES)), SZ = qnum('sz_sardine', CFG.SARDINE_SIZE);
  // 形：厚みのある紡錘形の体（左右に平たい）＋二股の尾。長さ方向が +Z。背は青み、腹は銀白
  var RN=8, SD=6, pos=[], col=[], idx=[], zN=0.065, zT=-0.045;
  for(var r=0;r<=RN;r++){
    var t=r/RN, z=zN+(zT-zN)*t, pf=Math.pow(Math.sin(Math.PI*Math.pow(t,0.75)),0.8)*(t>0.97?0.55:1);
    for(var q=0;q<SD;q++){
      var an=q/SD*Math.PI*2, cx=Math.cos(an), cy=Math.sin(an);
      pos.push(cx*0.011*pf, cy*0.021*pf, z);
      var bk=clamp(cy*0.7+0.5,0,1);          // 背=1 → 腹=0
      col.push(lerp(0.85,0.38,bk), lerp(0.88,0.5,bk), lerp(0.92,0.66,bk));
    }
  }
  for(var r2=0;r2<RN;r2++) for(var q2=0;q2<SD;q2++){
    var a0=r2*SD+q2, a1=r2*SD+(q2+1)%SD, b0=(r2+1)*SD+q2, b1=(r2+1)*SD+(q2+1)%SD;
    idx.push(a0,b0,a1, a1,b0,b1);
  }
  var base=pos.length/3;   // 尾びれ
  pos.push(0,0,zT+0.006, 0,0.027,zT-0.04, 0,-0.027,zT-0.04, 0,0,zT-0.012);
  for(var c=0;c<4;c++) col.push(0.7,0.8,0.9);
  idx.push(base,base+1,base+3, base,base+3,base+2);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  var mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide, emissive:0x11161b}), N);
  mesh.frustumCulled = false; mesh.visible = false; mesh.renderOrder = 6;
  mesh.material.color.copy(SD_SIL);
  world.add(mesh);
  // 群れを4つに分け、半径と高さの違う渦にする。個体ごとに少しずつずらして、群れらしいまとまりを出す
  var CL=[{R:1.9,h:0.10,w:0.70},{R:2.4,h:-0.20,w:0.58},{R:2.9,h:0.30,w:0.50},{R:3.5,h:-0.05,w:0.42}];
  var fs=[];
  for(var j=0;j<N;j++){
    var k=j%CL.length, c=CL[k], rnd=Math.random;
    fs.push({
      k:k, R:c.R+(rnd()-0.5)*0.55, h:c.h+(rnd()-0.5)*0.9, w:c.w*(0.9+rnd()*0.2),
      sp:(rnd()-0.5)*1.1,           // 群れの中での、進行方向のずれ(rad)
      ph:rnd()*6.28, bump:0.8+rnd()*0.7, dly:rnd()*1.4, dur:2.2+rnd()*1.0,
      br:0.78+rnd()*0.22,           // 個体ごとの明るさ
      // 水の中での待機（水面の中心まわりの小さな渦）
      ir:0.25+rnd()*0.65, iw:(0.9+rnd()*0.9), iy:-0.18-rnd()*0.4, ia:rnd()*6.28,
      p:new THREE.Vector3(), v:new THREE.Vector3(), init:false
    });
  }
  school = {mesh:mesh, f:fs, N:N, SZ:SZ, CL:CL, state:'idle', launchAt:0, t0:0, base:[0.3+Math.random()*6.28,1.6,3.1,4.6], uT:{value:0}};
  loadSardineGLB();
}
/* iwashi_small.glb（頭が+Z・長さ0.15m・骨なし）が読めたら、図形のイワシと入れ替える。読めなければ図形のまま */
function loadSardineGLB(){
  if(!THREE.GLTFLoader){ glbLog.push('sd:noLoader'); return; }
  var ld; try{ ld=makeGlbLoader(); }catch(e){ glbLog.push('sd:loaderErr'); return; }
  fetch('iwashi_small.glb').then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
  .then(function(buf){ return new Promise(function(res,rej){ ld.parse(buf,'',res,rej); }); })
  .then(function(g){
    var m=null; g.scene.traverse(function(o){ if(!m&&o.isMesh) m=o; });
    if(!m||!m.material.map) throw new Error('noMesh');
    var sc=school, geo=m.geometry, ph=new Float32Array(sc.N);
    for(var i=0;i<sc.N;i++) ph[i]=sc.f[i].ph;
    geo.setAttribute('aPh',new THREE.InstancedBufferAttribute(ph,1));   // 個体ごとの尾の振りのずれ
    var mat=new THREE.MeshStandardMaterial({map:m.material.map, roughness:0.6, metalness:0.1, emissive:0x11161b, side:THREE.DoubleSide});
    mat.color.copy(sc.mesh.material.color);
    mat.onBeforeCompile=function(sh){
      sh.uniforms.uT=sc.uT;
      sh.vertexShader=sh.vertexShader
        .replace('#include <common>','#include <common>\nuniform float uT;\nattribute float aPh;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed.x += sin(uT*12.0 - transformed.z*45.0 + aPh*3.0) * 0.011 * pow(clamp(-transformed.z/0.075,0.0,1.0),2.0);');   // 尾を左右に振る
    };
    var old=sc.mesh.geometry, oldM=sc.mesh.material;
    sc.mesh.geometry=geo; sc.mesh.material=mat; old.dispose(); oldM.dispose();
    glbLog.push('iwashi:ok');
  }).catch(function(e){ glbLog.push('iwashi:NG('+String((e&&e.message)||e).slice(0,40)+')'); });
}
function updateSchool(dt){
  var sc=school; if(!sc) return;
  var show=(S.state==='water'||S.state==='popped');
  sc.mesh.visible=show; if(!show) return;
  if(sc.state==='idle'&&S.state==='popped'&&T>=sc.launchAt){ sc.state='rise'; sc.t0=T; Snd.splash(0.35); }
  var yaw=waterRig.rotation.y, cy=Math.cos(yaw), sy=Math.sin(yaw), wx=waterRig.position.x, wz=waterRig.position.z;
  var rising=(sc.state==='rise'), wk=ease(S.waterK), idleSc=0.8;
  for(var i=0;i<sc.N;i++){
    var f=sc.f[i], th, e=0, u=0;
    // A：水の中の位置（ワールド座標に直す）
    th=f.iw*T+f.ia;
    var ax=Math.cos(th)*f.ir, az=Math.sin(th)*f.ir*0.8;
    sdA.set(wx+ax*cy+az*sy, f.iy+Math.sin(T*1.7+f.ph)*0.04, wz-ax*sy+az*cy);
    if(rising){
      u=clamp((T-sc.t0-f.dly)/f.dur,0,1); e=ease(u);
      // B：顔のまわりの回遊（群れごとに半径・高さ・速さが違う渦）
      var cl=sc.CL[f.k], g=sc.base[f.k]+cl.w*T+f.sp*(1+0.25*Math.sin(T*0.6+f.k));
      sdB.set(Math.cos(g)*f.R, S.eyeH+f.h+0.35*Math.sin(g*2+f.k)+Math.sin(T*1.3+f.ph)*0.06, Math.sin(g)*f.R);
      f.p.x=lerp(sdA.x,sdB.x,e); f.p.z=lerp(sdA.z,sdB.z,e);
      f.p.y=lerp(sdA.y,sdB.y,e)+Math.sin(Math.PI*e)*f.bump;   // 水面から立ち上がる弧
    }else{
      f.p.copy(sdA);
    }
    // 顔に近づきすぎない
    tmpV2.copy(f.p).sub(headL); var d=tmpV2.length();
    if(d<CFG.KEEP&&d>1e-4){ tmpV2.multiplyScalar(CFG.KEEP/d); f.p.copy(headL).add(tmpV2); }
    // 向き：進んだ方向（なめらかに）
    if(f.init&&dt>1e-4){
      var k2=1-Math.exp(-dt*6);
      f.v.x+=((f.p.x-f.q0x)/dt-f.v.x)*k2; f.v.y+=((f.p.y-f.q0y)/dt-f.v.y)*k2; f.v.z+=((f.p.z-f.q0z)/dt-f.v.z)*k2;
    }
    f.q0x=f.p.x; f.q0y=f.p.y; f.q0z=f.p.z; f.init=true;
    var hz=Math.hypot(f.v.x,f.v.z);
    sdDummy.position.copy(f.p);
    sdDummy.rotation.set(-Math.atan2(f.v.y,hz||1e-4), Math.atan2(f.v.x,f.v.z)+Math.sin(T*12+f.ph*3)*0.07, Math.sin(T*2.5+f.ph)*0.15, 'YXZ');   // 体をくねらせて泳ぐ
    sdDummy.scale.setScalar(sc.SZ*lerp(idleSc,1,easeOut(u*1.3))*wk);
    sdDummy.updateMatrix(); sc.mesh.setMatrixAt(i,sdDummy.matrix);
  }
  sc.uT.value=T;
  sc.mesh.material.color.lerpColors(SD_SIL,SD_WHITE,rising?clamp((T-sc.t0)/1.5,0,1):0);   // 色：飛び出すと銀色へ
  sc.mesh.instanceMatrix.needsUpdate=true;
}

/* ============ GLBの差し込み（失敗・遅延したら図形の魚のまま続行） ============ */
/* 各モデルは「長さ1・前方+Z」に正規化して使う。向きが逆・横向きなら yaw(度) を調整。
   確認用に URL で上書きもできる：?yaw_tuna=180&yaw_whale=90&sc_turtle=1.2 など */
function qnum(k,d){ var m=location.search.match(new RegExp('[?&]'+k+'=(-?[0-9.]+)')); return m?parseFloat(m[1]):d; }
var GLB_DEF = {
  tuna:  {file:'tuna_fish.glb', yaw:qnum('yaw_tuna',0),   sc:qnum('sc_tuna',1),   anim:1},
  turtle:{file:'sea_turtle.glb',yaw:qnum('yaw_turtle',0), sc:qnum('sc_turtle',1), anim:1},
  whale: {file:'blue_whale.glb',yaw:qnum('yaw_whale',0),  sc:qnum('sc_whale',1),  anim:1}
};
var glbLog=[], glbPending=0, glbExpired=false, glbClock=false, glbLoader=null;
function startGlbClock(){ if(glbClock) return; glbClock=true; setTimeout(function(){ glbExpired=true; },CFG.GLB_TIMEOUT*1000); }
function makeGlbLoader(){
  var ld=new THREE.GLTFLoader();
  try{ if(THREE.DRACOLoader){ var dl=new THREE.DRACOLoader(); dl.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'); ld.setDRACOLoader(dl); } }catch(e){}

/* 骨付きモデルの複製（テクスチャは共有。マグロ3匹でも読み込みは1回） */
function cloneModel(src){
  var clone=src.clone(true), sL=new Map(), cL=new Map();
  (function pt(a,b){ sL.set(b,a); cL.set(a,b); for(var i=0;i<a.children.length;i++) pt(a.children[i],b.children[i]); })(src,clone);
  clone.traverse(function(n){
    if(!n.isSkinnedMesh) return;
    var sm=sL.get(n), sk=sm.skeleton.clone();
    sk.bones=sm.skeleton.bones.map(function(b){ return cL.get(b); });
    n.skeleton=sk; n.bindMatrix.copy(sm.bindMatrix); n.bind(sk,n.bindMatrix);
  });
  return clone;
}
function prepModel(root){
  root.traverse(function(m){
    if(!m.isMesh) return;
    m.frustumCulled=false;   // 骨アニメで形が変わっても消えないように
    var one=!Array.isArray(m.material), arr=one?[m.material]:m.material;
    var cl=arr.map(function(mt){ var c=mt.clone(); if(c.metalness!==undefined) c.metalness=Math.min(c.metalness,0.25); return c; });   // 魚ごとに色を変えるので材質は複製（テクスチャは共有）
    m.material=one?cl[0]:cl;
    m.userData.tints=cl.map(function(c){ return {mat:c,base:c.color.clone()}; });
  });
}
function measureModel(scn){
  scn.updateMatrixWorld(true);
  var box=new THREE.Box3().setFromObject(scn,true), size=new THREE.Vector3(), ctr=new THREE.Vector3();
  box.getSize(size); box.getCenter(ctr);
  var L=Math.max(size.x,size.z);
  if(!isFinite(L)||L<=0||!isFinite(ctr.x+ctr.y+ctr.z)) throw new Error('bbox');
  return {L:L,ctr:ctr,alongX:size.x>size.z};
}
function wrapModel(gltf,nm,def,ph){
  var scn=cloneModel(gltf.scene); prepModel(scn);
  var inner=new THREE.Group(); inner.add(scn); inner.position.copy(nm.ctr).negate();
  var pivot=new THREE.Group(); pivot.add(inner); pivot.scale.setScalar(def.sc/nm.L);
  pivot.rotation.y=(nm.alongX?-Math.PI/2:0)+def.yaw*Math.PI/180;   // 横向き（ウミガメ）は自動で前方+Zへ
  var wrap=new THREE.Group(); wrap.add(pivot); wrap.userData.pivot=pivot;
  var an=gltf.animations||[];
  if(an.length){
    var clip=an.reduce(function(a,b){ return b.tracks.length>a.tracks.length?b:a; });   // トラックが一番多いものを使う
    var mx=new THREE.AnimationMixer(scn), act=mx.clipAction(clip); act.timeScale=def.anim; act.play(); mx.update(ph*0.7); wrap.userData.mixer=mx;
  }
  return wrap;
}
function swapFish(f,obj){
  if(f.state!=='idle'||glbExpired) return false;
  var old=f.obj; tintFish(obj,0);
  obj.scale.copy(old.scale); obj.position.copy(old.position); obj.quaternion.copy(old.quaternion);
  waterRig.remove(old); waterRig.add(obj); f.obj=obj; return true;
}
function loadGLBs(){
  if(!THREE.GLTFLoader){ glbLog.push('noLoader'); return; }
  try{ glbLoader=makeGlbLoader(); }catch(e){ glbLog.push('loaderErr'); return; }
  var jobs={};
  fish.forEach(function(f){
    var k=f.d.kind, def=GLB_DEF[k]; if(!def) return;
    if(!jobs[k]) jobs[k]=fetch(def.file).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(function(buf){ return new Promise(function(res,rej){ glbLoader.parse(buf,'',res,rej); }); })
      .then(function(g){ return {g:g,nm:measureModel(g.scene)}; });
    glbPending++;
    jobs[k].then(function(r){
      var ok=swapFish(f,wrapModel(r.g,r.nm,def,f.ph));
      glbLog.push(k+(ok?':ok':':late')+'(L'+r.nm.L.toFixed(1)+(r.nm.alongX?',X':',Z')+')');
    }).catch(function(e){
      glbLog.push(k+':NG('+String((e&&e.message)||e).slice(0,40)+')');
    }).then(function(){ glbPending--; });
  });
}

/* ============ 音（Web Audioで合成。市場のざわめきだけ market.mp3 を使う。無ければ無音） ============ */
var MARKET_FILE='market.mp3', VOICE_FILE='voice.mp3';
/* voice.mp3 の中の3つの掛け声（秒）。ランダムに1つずつ、少しピッチを変えて、左右の位置もばらして重ねる */
var VOICE_CUT=[[0,2.25],[2.76,4.55],[4.95,5.62]];
var Snd=(function(){
  var AC=window.AudioContext||window.webkitAudioContext;
  var ctx=null, master=null, mGain=null, seaGain=null, noiseBuf=null, seaBuf=null, seaSrc=null;
  var mBuf=null, vBuf=null, mSrc=null, mWanted=false, seaOn=false, nextBub=0, nextVoice=2.5, lastVoice=-1, loaded=false, retry=null;

  function init(){
    if(ctx||!AC) return;
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // iOSのマナーモードでも鳴らす
    try{ ctx=new AC(); }catch(e){ ctx=null; return; }
    var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=6;   // 急に大きい音が出ないように
    master=ctx.createGain(); master.gain.value=0.8; master.connect(comp); comp.connect(ctx.destination);
    mGain=ctx.createGain(); mGain.gain.value=0; mGain.connect(master);
    seaGain=ctx.createGain(); seaGain.gain.value=0; seaGain.connect(master);
    // 白色ノイズ（しぶき用）
    var n=ctx.sampleRate*2; noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate); var d=noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    ctx.onstatechange=function(){ if(ctx.state==='running') onRunning(); };
  }
  function loadBuf(file,cb){
    try{
      fetch(file).then(function(r){ if(!r.ok) throw new Error('no file'); return r.arrayBuffer(); }).then(function(ab){
        return new Promise(function(res,rej){ var p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
      }).then(cb).catch(function(){});   // ファイルが無ければ無音で続行
    }catch(e){}
  }
  function loadMarket(){
    if(loaded||!ctx) return; loaded=true;
    loadBuf(MARKET_FILE,function(b){ mBuf=b; startMarket(); });
    loadBuf(VOICE_FILE,function(b){ vBuf=b; });
  }
  function voice(){   // 市場の男性の掛け声
    if(!vBuf||!ctx) return;
    var i; do{ i=Math.floor(Math.random()*VOICE_CUT.length); }while(i===lastVoice&&VOICE_CUT.length>1); lastVoice=i;
    var c=VOICE_CUT[i], rate=0.9+Math.random()*0.2, dur=(c[1]-c[0])/rate, t=ctx.currentTime+0.02;
    var src=ctx.createBufferSource(); src.buffer=vBuf; src.playbackRate.value=rate;
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3500+Math.random()*2500;   // 遠くから聞こえる感じ
    var g=ctx.createGain(), v=0.35+Math.random()*0.3;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.04); g.gain.setValueAtTime(v,t+Math.max(0.05,dur-0.1)); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    src.connect(lp); lp.connect(g); pan(g,Math.random()*1.8-0.9).connect(master);
    src.start(t,c[0],c[1]-c[0]);
  }
  function onRunning(){
    // iOS対策：無音を1回鳴らして出力を有効にする
    try{ var b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(e){}
    startMarket();
  }
  function startMarket(){
    if(!ctx||!mBuf||mSrc||!mWanted||ctx.state!=='running'||seaOn) return;
    mSrc=ctx.createBufferSource(); mSrc.buffer=mBuf; mSrc.loop=true; mSrc.connect(mGain);
    var t=ctx.currentTime; mGain.gain.cancelScheduledValues(t); mGain.gain.setValueAtTime(0,t); mGain.gain.linearRampToValueAtTime(0.4,t+1.5);
    mSrc.start(0);
  }
  function stopMarket(){
    if(!ctx||!mSrc) return; var s=mSrc; mSrc=null;
    var t=ctx.currentTime; mGain.gain.cancelScheduledValues(t); mGain.gain.setValueAtTime(mGain.gain.value,t); mGain.gain.linearRampToValueAtTime(0,t+1.2);
    setTimeout(function(){ try{ s.stop(); }catch(e){} },1400);
  }
  function brown(sec){   // ループのつなぎ目が目立たない水中のこもった音
    var sr=ctx.sampleRate, n=Math.floor(sr*sec), N=Math.floor(sr*0.5), len=n+N, tmp=new Float32Array(len), b=0, i;
    for(i=0;i<len;i++){ b=(b+0.02*(Math.random()*2-1))/1.02; tmp[i]=b*3.5; }
    var buf=ctx.createBuffer(1,n,sr), d=buf.getChannelData(0);
    for(i=0;i<n;i++) d[i]=tmp[i];
    for(i=0;i<N;i++){ var k=i/N; d[i]=tmp[i]*k+tmp[n+i]*(1-k); }
    return buf;
  }
  function pan(node,v){ try{ if(ctx.createStereoPanner){ var p=ctx.createStereoPanner(); p.pan.value=v; node.connect(p); return p; } }catch(e){} return node; }
  function bubble(){
    var t=ctx.currentTime+0.01, o=ctx.createOscillator(), g=ctx.createGain(), f0=500+Math.random()*800;
    o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*1.7,t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.045,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.connect(g); pan(g,Math.random()*1.6-0.8).connect(master); o.start(t); o.stop(t+0.15);
  }
  return {
    attempt:function(){   // タッチなしで鳴らせる環境なら、すぐ鳴らす。だめなら鳴らせるようになるまで0.8秒ごとに再試行
      init(); if(!ctx) return; loadMarket(); try{ ctx.resume(); }catch(e){}
      if(!retry) retry=setInterval(function(){
        if(!ctx||ctx.state==='closed'||ctx.state==='running'){ clearInterval(retry); retry=null; return; }
        try{ ctx.resume(); }catch(e){}
      },800);
    },
    unlock:function(){
      init(); if(!ctx) return; loadMarket();
      if(ctx.state!=='running'){ try{ var p=ctx.resume(); if(p&&p.then) p.then(function(){ if(ctx.state==='running') onRunning(); }); }catch(e){} }
    },
    running:function(){ return !AC || (ctx&&ctx.state==='running'); },
    state:function(){ return ctx?ctx.state:'none'; },
    market:function(on){ mWanted=on; if(on) startMarket(); else stopMarket(); },
    splash:function(a){   // a: 0〜1。立ち上がりはゆるやかに
      if(!ctx||ctx.state==='closed') return;
      var t=ctx.currentTime+0.005;
      var src=ctx.createBufferSource(); src.buffer=noiseBuf;
      var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(500,t+0.55);
      var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.26*a,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      src.connect(lp); lp.connect(g); g.connect(master); src.start(t,Math.random()*1.0,0.8);
      var o=ctx.createOscillator(), og=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(170,t+0.2);
      og.gain.setValueAtTime(0.0001,t); og.gain.linearRampToValueAtTime(0.14*a,t+0.015); og.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
      o.connect(og); og.connect(master); o.start(t); o.stop(t+0.26);
    },
    sea:function(){   // 水中のこもった音に切り替える
      if(!ctx||seaOn) return; seaOn=true; mWanted=false; stopMarket();
      seaBuf=seaBuf||brown(6);
      seaSrc=ctx.createBufferSource(); seaSrc.buffer=seaBuf; seaSrc.loop=true;
      var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.7;
      seaSrc.connect(lp); lp.connect(seaGain);
      var t=ctx.currentTime; seaGain.gain.cancelScheduledValues(t); seaGain.gain.setValueAtTime(0,t); seaGain.gain.linearRampToValueAtTime(0.16,t+2.6);
      seaSrc.start(0); nextBub=1.2;
    },
    tick:function(dt){
      if(!ctx||ctx.state!=='running') return;
      if(mWanted&&!seaOn&&vBuf){ nextVoice-=dt; if(nextVoice<=0){ voice(); nextVoice=3.5+Math.random()*5; } }   // 市場の間だけ
      if(!seaOn) return;
      nextBub-=dt;
      if(nextBub<=0){ bubble(); if(Math.random()<0.4) setTimeout(bubble,90+Math.random()*80); if(Math.random()<0.2) setTimeout(bubble,230+Math.random()*100); nextBub=0.3+Math.random()*1.2; }
    },
    suspend:function(){ if(ctx&&ctx.state==='running') try{ ctx.suspend(); }catch(e){} },
    resume:function(){ if(ctx&&ctx.state==='suspended') try{ ctx.resume(); }catch(e){} },
    stop:function(){ if(ctx&&ctx.state!=='closed') try{ ctx.close(); }catch(e){} }
  };
})();
// 自動再生がブロックされたとき、最初のタッチで解除する
['pointerdown','pointerup','touchend','click','keydown'].forEach(function(ev){
  window.addEventListener(ev,function(){ Snd.unlock(); },true);
});
document.addEventListener('visibilitychange',function(){ if(document.hidden) Snd.suspend(); else Snd.resume(); });
var sndShown=null;
function updSndLabel(){
  var want=S.ready&&!S.xr&&!Snd.running();
  if(want!==sndShown){ sndShown=want; elSnd.hidden=!want; }
}

/* ============ 終了 ============ */
function stopCam(){ try{ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }catch(e){} try{ vid.srcObject=null; }catch(e){} }
function endExperience(){
  stopCam(); Snd.stop();
  var wait=0;
  try{ if(scene.renderer&&scene.renderer.xr&&scene.renderer.xr.getSession()){ scene.exitVR(); wait=350; } }catch(e){}
  setTimeout(function(){ location.href='end.html'; },wait);
}
elQuit.addEventListener('click',endExperience);
elPlace.addEventListener('click',function(){ place(true); });
window.addEventListener('pagehide',function(){ stopCam(); Snd.stop(); });

/* ============ 毎フレーム ============ */
function frame(tMs,dtMs){
  var dt=Math.min(dtMs/1000,0.05); T+=dt;
  if(!S.built||!S.ready) return;

  camEl.object3D.getWorldPosition(vCam); headL.copy(vCam); world.worldToLocal(headL);

  // 進行
  if(S.state==='market'&&T-S.tStart>CFG.T_WATER&&(glbPending<=0||glbExpired)){
    S.state='water'; S.tWater=T; place(false); waterRig.visible=true;
  }
  if(S.state==='water'){
    if(!S.hintShown&&T-S.tWater>CFG.T_HINT) showHint();
    if(!S.glow&&T-S.tWater>CFG.T_GLOW) S.glow=true;
  }
  if(S.state==='popped'){
    fish.forEach(function(f){ if(f.state==='idle'&&T>=f.launchAt) launch(f); });
  }

  // 市場
  var tgt=S.marketTarget, rate=tgt?1/1.2:1/1.6;
  S.marketFade+=clamp(tgt-S.marketFade,-dt*rate,dt*rate);
  if(S.state!=='boot') applyMarketFade();
  sways.forEach(function(s){ s.o.rotation[s.ax]=Math.sin(T*s.f+s.ph)*s.amp; });

  // 海への切り替え
  if(S.seaT0>=0){
    var e=T-S.seaT0;
    S.seaK=clamp((e-0.2)/2.2,0,1);
    S.discFade=1-clamp((e-0.3)/1.4,0,1);
    var p=clamp(e/2.4,0,1);
    waveRing.scale.setScalar(0.3+p*10); waveRing.material.opacity=0.6*(1-p);
    if(p>=1) waveRing.visible=false;
    seaMesh.material.opacity=S.seaMax*ease(S.seaK);
    bubbles.material.opacity=0.75*S.seaK;
    raysGroup.children.forEach(function(r){ r.material.opacity=S.seaK*(0.07+0.05*Math.sin(T*0.5+r.userData.ph)); });
    var bd=bubbles.userData, pos=bubbles.geometry.attributes.position.array, top=S.eyeH+3;
    for(var i=0;i<bd.bv.length;i++){
      pos[i*3+1]+=bd.bv[i]*dt; if(pos[i*3+1]>top) pos[i*3+1]=0.1;
      pos[i*3]=bd.bx[i]+Math.sin(T*0.8+i)*0.06; pos[i*3+2]=bd.bz[i]+Math.cos(T*0.7+i)*0.06;
    }
    bubbles.geometry.attributes.position.needsUpdate=true;
    if(S.discFade<=0.001) { disc.visible=false; disc.userData.edge.visible=false; glowDisc.visible=false; }
  }

  // 水面
  if(waterRig.visible){
    if(S.state!=='market') S.waterK=Math.min(1,S.waterK+dt/1.5);
    var k=ease(S.waterK)*S.discFade;
    disc.material.opacity=k; disc.scale.setScalar(0.3+0.7*ease(S.waterK));
    disc.userData.edge.material.opacity=0.45*k; disc.userData.edge.scale.setScalar(0.3+0.7*ease(S.waterK));
    glowDisc.material.opacity=(S.glow&&S.state==='water')?(0.09+0.09*Math.sin(T*1.4))*k:0;
    // 誘導用のゆっくりした波紋
    if(S.state==='water'&&S.waterK>0.5){
      S._rt=(S._rt||0)-dt;
      if(S._rt<=0){ S._rt=S.glow?1.1:1.9; spawnRipple(0,0,S.glow?1.05:0.75,S.glow?0.95:0.55,S.glow?2.8:2.4,0,S.glow); }
    }
    ripples.forEach(function(r){
      if(!r.on) return;
      if(r.delay>0){ r.delay-=dt; return; }
      r.age+=dt; var u=r.age/r.life;
      if(u>=1){ r.on=false; r.m.visible=false; return; }
      r.m.visible=true; r.m.scale.setScalar(Math.max(0.02,r.R*(1-Math.pow(1-u,2))));
      r.m.material.opacity=r.peak*(1-u)*S.discFade;
    });
    if(S.discFade<=0.001&&S.seaT0>=0&&!ripples.some(function(r){return r.on;})) waterRig.visible=false;
  }

  // 魚
  fish.forEach(function(f){ updateFish(f,dt); });
  try{ updateSchool(dt); }catch(err){ if(school) school.err=String(err&&err.message||err); }
  Snd.tick(dt); updSndLabel();

  // XR：ヒントは常にこちらを向ける。3Dボタンの表示切り替え
  if(S.xr){
    if(hintMesh&&hintMesh.visible) hintMesh.lookAt(vCam);
    xrButtons.forEach(function(b){ b.mesh.visible=true; });
  }
  if(!elDbg.hidden){
    var gl=glbLog.filter(function(x){ return !/^(iwashi|sd:)/.test(x); }), sl=glbLog.filter(function(x){ return /^(iwashi|sd:)/.test(x); });
    elDbg.textContent=S.state+' sensor:'+(camEl.components['gyro-look']&&camEl.components['gyro-look'].hasSensor)+' xr:'+S.xr+' t:'+T.toFixed(1)+' snd:'+Snd.state()
      +'\nglb: '+gl.join(' ')
      +'\nsd: '+(school?(school.state+'/'+(school.mesh.visible?'show':'hide')+'/'+school.N+(school.err?'/ERR '+school.err:'')):'none')+' '+sl.join(' ');
  }
  if(!elMotion.hidden&&camEl.components['gyro-look']&&camEl.components['gyro-look'].hasSensor) elMotion.hidden=true;
}
window.__zkFrame=frame;

/* ============ 開始まわり ============ */
function startExperience(){
  if(S.ready) return;
  if(!S.built){ S.pending=true; return; }
  S.ready=true; place(true);
  S.state='market'; S.tStart=T;
  startGlbClock(); Snd.market(true);
  if(!S.xr){
    // iOSで傾きが届かないときだけ、許可ボタンを出す
    setTimeout(function(){
      var gl=camEl.components['gyro-look'];
      if(needMotionPerm&&gl&&!gl.hasSensor) elMotion.hidden=false;
    },1500);
  }
}
elMotion.addEventListener('click',function(){ requestMotion().then(function(r){ if(r==='granted') elMotion.hidden=true; }); });

function startCamera(){
  showGate(TXT.camLoading,null,null);
  var ok=false;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no mediaDevices');
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(s){
      stream=s; vid.srcObject=s; var pr=vid.play(); if(pr&&pr.catch) pr.catch(function(){});
      hideGate(); startExperience(); Snd.attempt();   // カメラ使用中は音も許可されやすい端末がある
    }).catch(failCam);
    ok=true;
  }catch(e){}
  if(!ok) failCam();
}
function failCam(){
  showGate(TXT.camDeny,TXT.start,function(){ requestMotion(); startCamera(); });   // タップから再試行
}

function questStart(){
  requestMotion();
  try{ scene.enterAR(); }catch(e){}
  setTimeout(function(){ if(!S.xr) showGate(TXT.noXR,TXT.start,questStart); },5000);
}
function questGate(){ showGate(TXT.quest,TXT.start,questStart); }
scene.addEventListener('enter-vr',function(){
  S.xr=true; document.body.classList.add('xr'); hideGate();
  setTimeout(startExperience,800);   // 姿勢が安定してから位置を決める
});
scene.addEventListener('exit-vr',function(){
  S.xr=false; document.body.classList.remove('xr');
  if(isQuest&&!/end\.html/.test(location.href)) questGate();
});

function init(){
  world=new THREE.Group(); scene.object3D.add(world);
  uiRig=new THREE.Group(); scene.object3D.add(uiRig);
  buildMarket(); buildWater(); buildSea(); buildFish(); buildSchool(); buildXrUi();
  Snd.attempt(); loadGLBs();
  S.marketFade=0; applyMarketFade();
  S.built=true;
  if(S.pending) startExperience();
}
function boot(){
  showGate(TXT.camLoading,null,null);
  var all=Object.keys(TXT).map(function(k){return plain(TXT[k]);}).join('')+'雑喉場大漁鮮魚活';
  var fonts=document.fonts&&document.fonts.load?Promise.all([
    document.fonts.load('700 56px "Noto Sans JP"',all),
    document.fonts.load('800 80px "Shippori Mincho B1"',all)
  ]).catch(function(){}):Promise.resolve();
  var timeout=new Promise(function(r){ setTimeout(r,1500); });
  Promise.race([fonts,timeout]).then(function(){
    init();
    if(isQuest) questGate(); else startCamera();
  });
}
if(scene.hasLoaded) boot(); else scene.addEventListener('loaded',boot);

})();
</script>
